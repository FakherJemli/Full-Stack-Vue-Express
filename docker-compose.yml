# docker-compose.yml — Generated for Express + Vue
version: '3.8'

services:

  backend:
    build:
      context: ./.
      dockerfile: Dockerfile
    container_name: app_backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: app_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
